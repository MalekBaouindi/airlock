[project]
name = "airlock"
version = "0.0.1"
description = "Runtime provenance enforcement and adversarial evaluation for the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# The relay core is deliberately near-dependency-free. A security gateway that
# you interpose into your agent traffic should not drag in a large transitive
# tree, and it must not depend on the MCP SDK to inspect MCP traffic -- doing so
# would couple our parser to one revision of the protocol.
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Real MCP clients/servers, used only by the integration suite and the eval
# harness. Pinned below v2 until the SDK's 2026-07-28 revision is verified
# against our relay.
integration = [
    "mcp>=1.27,<2",
]
local-llm = [
    "llama-cpp-python>=0.3",
    "huggingface-hub>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Every test gets a hard ceiling. Two of these tests spawn a real MCP server
    # and talk to it over a pipe, so a regression in the read deadline makes them
    # wait rather than fail -- and a suite that hangs in CI reports nothing about
    # which change caused it. A timeout converts "the run never finished" into a
    # named failure.
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
airlock = "airlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
# A global ceiling, plus a per-test marker (`@pytest.mark.timeout(n)`) for the
# handful of tests that legitimately wait on a real MCP server. `thread` rather
# than `signal` because the slow ones are waiting inside a subprocess pipe, where
# only another thread can be interrupted.
timeout = 120
timeout_method = "thread"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
